<div class="container">
  <h2>Sair do Jogo?</h2>

  <p>Você terá que iniciar do zero novamente</p>

  <div class="container-btn">
    <button mat-raised-button (click)="closeDialog()">
      Fechar
    </button>

    <button mat-raised-button class="exit-btn" style="color: white; background-color: rgba(255, 0, 0, 0.774);" (click)="leaveGame()">
      Sair
    </button>
  </div>
</div>
