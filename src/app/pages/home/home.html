<app-header></app-header>

  <main id="/">
    <!-- CONTAINER -->
    <section>
      <div class="container-hero">

        <div class="container-title-hero-content ">
          <h2>Aprenda o Japonês <br> do Karatê</h2>
          <span></span>
        </div>

        <p>- - - - - Palavras, comandos e filosófia do dojo - - - - -</p>

        <div>
          <a href="../explorar/">
            <button class="explore-btn">Explorar</button>
          </a>
          <a href="../games/">
            <button class="jogo-btn">Jogos</button>
          </a>
        </div>

      </div>

      <img src="/phone.webp" alt="Hero Karate">

    </section>

    <!-- SEÇÃO DOS CARDS E JOGOS -->

    <div class="container-items">
      <app-introduce-karate-home [reverse]="false" title="Golpes do Karatê" description="Aprenda os nomes reais dos golpes em japonês e conecte cada técnica ao seu significado dentro do dojo." tag="Golpes do Karatê" img="/tori-new.webp"></app-introduce-karate-home>

      <app-introduce-karate-home [reverse]="true" title="Posições" description="Entenda as bases do karatê em japonês e desenvolva postura, equilíbrio e estabilidade." tag="Bases do Karatê" img="/punch-blue.webp"></app-introduce-karate-home>

      <app-introduce-karate-home [reverse]="false" title="Comandos do Dojo" description="Domine os comandos utilizados em treinos e graduações, compreendendo o que cada instrução significa e como reagir corretamente em japonês." tag="Comandos do Karatê" img="/karate-comando.webp"></app-introduce-karate-home>

      <app-introduce-karate-home [reverse]="true" title="Números em Japonês" description="Aprenda a contagem usada no karatê para acompanhar treinos, repetições e sequências, tornando sua prática mais natural e imersiva." tag="Números do Karatê" img="/number-new.webp"></app-introduce-karate-home>
