<div class="container" (click)="toogleCardFunc()">
  <div class="card-inner" [class.animation-flip-card]="toogleCard">

    <div class="card-front">
      <img [ngSrc]="imageUrl"
           fill
           [priority]="isPriority"
           alt="Card front"
           style="object-fit: cover;">

      <div class="container-bottom">
        <p>{{title}}</p>
      </div>
    </div>

    <div class="card-back">
      <p>{{meaning}}</p>
      <div class="container-bottom">
        <p>{{title}}</p>
      </div>
    </div>

  </div>
</div>
