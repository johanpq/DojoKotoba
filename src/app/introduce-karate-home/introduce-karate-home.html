<div class="feature-advanced">
  <div class="feature-bg"></div>

  <div class="feature-wrapper" [class.reverse]="reverse">

    <div class="feature-image">
      <img [src]="img" alt="Imagem">
    </div>

    <div class="feature-content">
      <span class="tag">{{tag}}</span>

      <h2>{{title}}</h2>

      <p>{{description}}</p>
    </div>

  </div>
</div>
